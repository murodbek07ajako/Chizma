<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aylanuvchi doiralar bilan chizish</title>
<meta name="theme-color" content="#0a0b11">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#0a0b11; --card:#14161f; --card2:#1c1f2c; --fg:#eceef5; --mute:#8e93a6;
  --accent:#ff7a59; --accent2:#ff4f8b; --line:#272b3a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0a0b11;--card:#14161f;--card2:#1c1f2c;--fg:#eceef5;--mute:#8e93a6;--line:#272b3a}
}
:root[data-theme="dark"]{--bg:#0a0b11;--card:#14161f;--card2:#1c1f2c;--fg:#eceef5;--mute:#8e93a6;--line:#272b3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 520px at 50% -8%,#1b1f3a 0%,rgba(27,31,58,0) 62%),var(--bg)}
main{display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 0 28px}
.stage{position:relative;width:min(100vw, calc((100vh - 220px) * 0.5625), 560px);min-width:260px;aspect-ratio:9/16;background:#09090c}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctl{width:min(100vw,560px);padding:0 14px;display:flex;flex-direction:column;gap:12px}
.card{background:linear-gradient(180deg,var(--card),#10121a);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.card h3{margin:0;font-size:15px;font-weight:650}
button{appearance:none;font:600 14px/1.2 system-ui,sans-serif;color:var(--fg);cursor:pointer;border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:12px 12px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.pill .ic{font-size:17px}
.big{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:0;border-radius:16px;text-align:left;color:#22090f;background:linear-gradient(135deg,#ff9a55,#ff4f8b)}
.big .ic{font-size:32px}
.big b{display:block;font-size:17px}
.big small{display:block;font-size:12px;font-weight:500;opacity:.8;margin-top:2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timeline{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 button{display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;padding:10px 6px;white-space:normal;text-align:center}
.seg3 small{font-size:11px;color:var(--mute);font-weight:500}
button.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chips button{flex:0 0 auto;border-radius:999px;padding:10px 15px}
.head{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:0;padding:2px;font-size:15px;font-weight:650}
.body{display:flex;flex-direction:column;gap:16px}
.opt h4{margin:0 0 3px;font-size:14px}
.opt p{margin:0 0 9px;font-size:12px;color:var(--mute);line-height:1.45}
.hint{font-size:12px;color:var(--mute);line-height:1.45}
.status{min-height:1.2em;font-size:13px;color:var(--accent);line-height:1.35}
.status.ok{color:#9ad6a8}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{position:relative;width:38px;height:38px;padding:0;border-radius:50%;border:3px solid var(--line)}
.sw button.on{border-color:#fff;box-shadow:none}
.sw button.cust{background:conic-gradient(#f33,#fd3,#3e6,#3df,#36f,#d3f,#f33)}
.sw button.cust i{position:absolute;inset:8px;border-radius:50%;background:var(--cc,#14161f);border:2px solid rgba(255,255,255,.85)}
input[type=text]{width:100%;background:#0e1017;color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:14px system-ui,sans-serif}
textarea{width:100%;min-height:150px;background:#0e1017;color:#e6e6e8;border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical;margin-bottom:8px}
.hide-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,5,9,.8)}
.sheet{width:min(100vw,560px);max-height:94vh;overflow:auto;background:#151823;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:17px}
.sheet video,.sheet img{width:100%;max-height:52vh;object-fit:contain;border-radius:14px;background:#09090c}
.main{border:0;color:#22090f;background:linear-gradient(135deg,#ff9a55,#ff4f8b);font-size:15px;padding:14px}
.prev{height:46px;border-radius:12px;background:#0b0c12;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.prev i{display:block;width:78%;height:6px;border-radius:3px;background:var(--cc,#fff)}
input.cs{-webkit-appearance:none;appearance:none;width:100%;height:16px;border-radius:8px;outline:none;border:1px solid var(--line)}
input.cs::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid #0a0b11;box-shadow:0 0 0 2px #fff}
input.cs::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid #0a0b11}
.hex{font:600 14px ui-monospace,Menlo,monospace;color:var(--mute);text-align:center}
.share{border-color:#3a4060;background:linear-gradient(180deg,#20243a,#191c2c)}
.bgs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.bgs button{position:relative;height:66px;padding:0;border-radius:12px;overflow:hidden;border:2px solid var(--line);background-size:cover}
.bgs button span{position:absolute;left:0;right:0;bottom:0;padding:3px 2px;font-size:10px;font-weight:600;text-align:center;background:rgba(0,0,0,.55);color:#fff}
.bgs button.on{border-color:#fff;box-shadow:none}
.tunes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tunes button{text-align:left;padding:12px 12px}
</style>
</head>
<body>
<main>
  <div class="stage" id="stage"><canvas id="cv"></canvas></div>

  <div class="ctl">
    <section class="card">
      <div class="grid3">
        <button id="play" class="pill"><span class="ic" id="playIc">⏸</span><span id="playLbl"></span></button>
        <button id="restart" class="pill"><span class="ic">↻</span><span data-i="replay"></span></button>
        <button id="skip" class="pill"><span class="ic">⏭</span><span data-i="result"></span></button>
      </div>
      <div class="timeline"><span id="tNow">0:00</span><input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Time"><span id="tAll">0:30</span></div>
      <div class="timeline"><span data-i="size"></span><input type="range" id="size" min="60" max="140" value="100" aria-label="Size"><span id="sizeVal">100%</span></div>
      <div class="grid2">
        <button id="speed" class="pill"></button>
        <button id="musicBtn" class="pill"></button>
      </div>
    </section>

    <section class="card">
      <button id="upload" class="big"><span class="ic">📷</span><span><b data-i="upload"></b><small data-i="upload_sub"></small></span></button>
      <div class="grid2">
        <button id="rec" class="pill"><span class="ic">🎬</span><span data-i="rec"></span></button>
        <button id="png" class="pill"><span class="ic">🖼</span><span data-i="png"></span></button>
      </div>
      <button id="shareApp" class="pill share"><span class="ic">📤</span><span data-i="share"></span></button>
      <div class="hint" data-i="save_note"></div>
      <div class="status" id="status"></div>
      <input class="hide-file" type="file" id="file" accept="image/*">
      <input class="hide-file" type="file" id="audioFile" accept="audio/*">
    </section>

    <section class="card" id="traceCard" hidden>
      <h3 data-i="how_title"></h3>
      <div class="seg3" id="seg">
        <button data-m="orig" class="on"><b data-i="orig"></b><small data-i="orig_d"></small></button>
        <button data-m="color"><b data-i="color"></b><small data-i="color_d"></small></button>
        <button data-m="edge"><b data-i="edge"></b><small data-i="edge_d"></small></button>
      </div>
      <div class="opt"><h4 data-i="detail"></h4><p data-i="detail_d"></p>
        <div class="timeline"><input type="range" id="detail" min="0" max="100" value="37" aria-label="Detail"><span id="detailVal" style="min-width:52px;text-align:right">4500</span></div></div>
    </section>

    <section class="card">
      <h3 data-i="flags_title"></h3>
      <div class="chips" id="chips"></div>
    </section>

    <section class="card">
      <h3 data-i="look_title"></h3>
      <div class="opt"><h4 data-i="bg_t"></h4><p data-i="bg_d"></p><div class="bgs" id="bgs"></div></div>
      <div class="opt"><h4 data-i="linecolor"></h4><p data-i="linecolor_d"></p><div class="sw" id="sw"></div></div>
    </section>

    <section class="card">
      <h3 data-i="music"></h3>
      <p class="hint" data-i="music_d"></p>
      <div class="tunes" id="tunes"></div>
      <div class="hint" id="musicName"></div>
    </section>

    <section class="card">
      <button class="head" id="setBtn"><span data-i="settings"></span><span id="setChev">▾</span></button>
      <div class="body" id="setBody" hidden>
        <div class="opt"><h4 data-i="wm"></h4><p data-i="wm_d"></p>
          <input type="text" id="wm" maxlength="32" placeholder="@bot" autocomplete="off"></div>
        <div class="opt"><h4 data-i="lang"></h4>
          <div class="seg3" id="langSeg"><button data-l="uz">O'zbek</button><button data-l="ru">Русский</button><button data-l="en">English</button></div></div>
      </div>
    </section>

    <section class="card">
      <button class="head" id="moreBtn"><span data-i="more"></span><span id="moreChev">▾</span></button>
      <div class="body" id="moreBody" hidden>
        <div class="opt"><h4 data-i="json_t"></h4><p data-i="json_d"></p>
          <textarea id="json" spellcheck="false"></textarea><button id="apply" class="pill" data-i="apply"></button></div>
      </div>
    </section>
  </div>
</main>

<div class="modal" id="colorModal" hidden>
  <div class="sheet">
    <h3 data-i="cm_title"></h3>
    <div class="prev"><i id="cmPrev"></i></div>
    <div class="opt"><h4 data-i="cm_hue"></h4><input class="cs" type="range" id="cmH" min="0" max="360" value="20"></div>
    <div class="opt"><h4 data-i="cm_sat"></h4><input class="cs" type="range" id="cmS" min="0" max="100" value="80"></div>
    <div class="opt"><h4 data-i="cm_val"></h4><input class="cs" type="range" id="cmV" min="25" max="100" value="100"></div>
    <div class="hex" id="cmHex">#ff8844</div>
    <button id="cmRainbow" class="pill" data-i="cm_rainbow"></button>
    <button id="cmDone" class="main" data-i="cm_done"></button>
  </div>
</div>

<div class="modal" id="resModal" hidden>
  <div class="sheet">
    <h3 id="resTitle"></h3>
    <div id="resMedia"></div>
    <button id="resSend" class="main" data-i="res_send" hidden></button>
    <button id="resSave" class="main" data-i="res_save"></button>
    <button id="resShare" class="pill" data-i="res_share"></button>
    <button id="resBrowser" class="pill" data-i="res_browser"></button>
    <div class="status ok" id="resNote"></div>
    <button id="resChat" class="pill" data-i="res_chat" hidden></button>
    <div class="hint" id="resHint"></div>
    <button id="resClose" class="pill" data-i="res_close"></button>
  </div>
</div>

/* ---------- shape builders (units, y points down) ---------- */
function circlePts(cx, cy, r, n = 120) {
  const p = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU; p.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
  return p;
}
function starPts(cx, cy, R, rot = -Math.PI / 2, n = 5, ratio) {
  const r = R * (ratio || Math.cos(TAU / n) / Math.cos(Math.PI / n));
  const p = [];
  for (let i = 0; i < 2 * n; i++) {
    const a = rot + i * Math.PI / n, q = i % 2 ? r : R;
    p.push([cx + q * Math.cos(a), cy + q * Math.sin(a)]);
  }
  return p;
}
function crescentPts(cx, cy, R, r, d, rot = 0) {
  const x = (d * d + R * R - r * r) / (2 * d);
  const y = Math.sqrt(Math.max(R * R - x * x, 0));
  const al = Math.atan2(y, x);
  const p = [];
  const n1 = 90, n2 = 70;
  for (let i = 0; i <= n1; i++) {
    const f = -al + (al - TAU + al) * (i / n1);
    p.push([R * Math.cos(f), R * Math.sin(f)]);
  }
  const b2 = Math.atan2(y, x - d), b1 = Math.atan2(-y, x - d) + TAU;
  for (let i = 1; i < n2; i++) {
    const f = b2 + (b1 - b2) * (i / n2);
    p.push([d + r * Math.cos(f), r * Math.sin(f)]);
  }
  const c = Math.cos(rot), s = Math.sin(rot);
  return p.map(([u, v]) => [cx + u * c - v * s, cy + u * s + v * c]);
}
function shapePts(s) {
  switch (s.k) {
    case "rect": return [[s.x, s.y], [s.x + s.w, s.y], [s.x + s.w, s.y + s.h], [s.x, s.y + s.h]];
    case "circle": return circlePts(s.cx, s.cy, s.r);
    case "star": return starPts(s.cx, s.cy, s.R, s.rot === undefined ? -Math.PI / 2 : s.rot, s.n || 5, s.ratio);
    case "crescent": return crescentPts(s.cx, s.cy, s.R, s.r, s.d, s.rot || 0);
    case "poly": return s.pts.map(p => [p[0], p[1]]);
  }
  throw new Error("Noma'lum shakl: " + s.k);
}

/* ---------- build the single closed curve + Fourier series ---------- */
let F = null, STAGES = STAGES_FLAG, TOTAL = 0;
let cosT = null, sinT = null;
function setM(m) {
  M = m; cosT = new Float64Array(M / 2); sinT = new Float64Array(M / 2);
  for (let i = 0; i < M / 2; i++) { cosT[i] = Math.cos(TAU * i / M); sinT[i] = Math.sin(TAU * i / M); }
}
setM(16384);
// in-place radix-2 FFT of length M (forward, e^{-i...})
function fft(re, im) {
  for (let i = 1, j = 0; i < M; i++) {
    let bit = M >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= M; len <<= 1) {
    const half = len >> 1, step = M / len;
    for (let i = 0; i < M; i += len) {
      for (let k = 0; k < half; k++) {
        const wr = cosT[k * step], wi = -sinT[k * step], a = i + k, b = a + half;
        const xr = re[b] * wr - im[b] * wi, xi = re[b] * wi + im[b] * wr;
        re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
      }
    }
  }
}

function buildFlag(flag) {
  let raw;
  if (flag.raw) raw = flag.raw;
  else {
    const polys = flag.shapes.map(s => ({ color: s.color, pts: shapePts(s) }));
    flag._polys = polys;
    const hw = flag.w / 2, hh = flag.h / 2;
    raw = [[hw, hh, 0], [hw, -hh, 0], [-hw, -hh, 0], [-hw, 0, 0]];
    let cur = [-hw, 0];
    for (const p of polys) {
      let bi = 0, bd = Infinity;
      p.pts.forEach((q, i) => { const d = (q[0] - cur[0]) ** 2 + (q[1] - cur[1]) ** 2; if (d < bd) { bd = d; bi = i; } });
      const n = p.pts.length;
      for (let j = 0; j <= n; j++) { const q = p.pts[(bi + j) % n]; raw.push([q[0], q[1], 1]); }
      cur = p.pts[bi];
    }
    raw.push([-hw, 0, 1], [-hw, hh, 0], [hw, hh, 0]);
  }
  const segLen = [];
  let L = 0;
  for (let i = 0; i < raw.length - 1; i++) {
    const l = Math.hypot(raw[i + 1][0] - raw[i][0], raw[i + 1][1] - raw[i][1]);
    segLen.push(l); L += l;
  }
  const X = new Float64Array(M), Y = new Float64Array(M), lab = new Uint8Array(M);
  let seg = 0, acc = 0;
  for (let i = 0; i < M; i++) {
    const s = i * L / M;
    while (seg < segLen.length - 1 && acc + segLen[seg] < s) { acc += segLen[seg]; seg++; }
    const t = segLen[seg] > 0 ? Math.min(1, (s - acc) / segLen[seg]) : 0;
    X[i] = raw[seg][0] + (raw[seg + 1][0] - raw[seg][0]) * t;
    Y[i] = raw[seg][1] + (raw[seg + 1][1] - raw[seg][1]) * t;
    lab[i] = raw[seg + 1][2];
  }
  // x(t)=a0+sum(a_k cos kt + b_k sin kt): all coefficients from one FFT per axis
  const KM = Math.min(M / 2 - 1, flag.kmax || (flag.free ? 4000 : 1000));
  const ax = new Float64Array(KM + 1), bx = new Float64Array(KM + 1);
  const ay = new Float64Array(KM + 1), by = new Float64Array(KM + 1);
  const re = new Float64Array(M), im = new Float64Array(M);
  re.set(X); fft(re, im);
  const a0x = re[0] / M;
  for (let k = 1; k <= KM; k++) { ax[k] = 2 * re[k] / M; bx[k] = -2 * im[k] / M; }
  re.set(Y); im.fill(0); fft(re, im);
  const a0y = re[0] / M;
  for (let k = 1; k <= KM; k++) { ay[k] = 2 * re[k] / M; by[k] = -2 * im[k] / M; }
  flag._d = { X, Y, lab, ax, bx, ay, by, a0x, a0y, km: KM, stage: {} };
  return flag;
}

function stageData(N) {
  const D = F._d;
  if (D.stage[N]) return D.stage[N];
  // partial sum of the first N harmonics = one inverse transform
  const rec = (a0, A, B) => {
    const re = new Float64Array(M), im = new Float64Array(M);
    re[0] = a0;
    for (let k = 1; k <= N; k++) { re[k] = A[k]; im[k] = B[k]; }
    fft(re, im);
    return re;
  };
  const xs = rec(D.a0x, D.ax, D.bx), ys = rec(D.a0y, D.ay, D.by);
  let num = 0;
  for (let i = 0; i < M; i++) num += (xs[i] - D.X[i]) ** 2 + (ys[i] - D.Y[i]) ** 2;
  const err = 100 * Math.sqrt(num / M) / F.h;
  const mk = (A, B) => {
    const arr = [];
    for (let k = 1; k <= N; k++) arr.push({ k, R: Math.hypot(A[k], B[k]), ph: Math.atan2(B[k], A[k]) });
    arr.sort((u, v) => v.R - u.R);
    return arr.slice(0, SHOW);
  };
  return (D.stage[N] = { xs, ys, err, cx: mk(D.ax, D.bx), cy: mk(D.ay, D.by) });
}

/* ---------- image analysis ---------- */
function rasterize(img, maxSide) {
  const ar = img.naturalWidth / img.naturalHeight;
  let W, H;
  if (ar >= 1) { W = maxSide; H = Math.max(8, Math.round(maxSide / ar)); }
  else { H = maxSide; W = Math.max(8, Math.round(maxSide * ar)); }
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
  g.drawImage(img, 0, 0, W, H);
  return { W, H, d: g.getImageData(0, 0, W, H).data };
}

/* Mode 1: flat colour regions -> outlines (flags, logos, cartoons) */
function traceColors(img, name, force) {

  for (let i = 0; i < n; i++) {
    const px = { r: d[i * 4], g: d[i * 4 + 1], b: d[i * 4 + 2] };
    let bi = 0, bd = Infinity;
    pal.forEach((p, j) => { const dd = dist(p, px); if (dd < bd) { bd = dd; bi = j; } });
    L[i] = bi;
  }

  const cnt = new Uint8Array(pal.length);

function hsv2hex(h, s, v) {
  s /= 100; v /= 100;
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; } else if (h < 120) { r = x; g = c; } else if (h < 180) { g = c; b = x; }
  else if (h < 240) { g = x; b = c; } else if (h < 300) { r = x; b = c; } else { r = c; b = x; }
  const to = n => Math.round((n + m) * 255).toString(16).padStart(2, "0");
  return "#" + to(r) + to(g) + to(b);
}
function hex2hsv(hex) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) h = mx === r ? ((g - b) / d + 6) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return { h: Math.round(h * 60), s: Math.round(mx ? d / mx * 100 : 0), v: Math.round(mx * 100) };
}

  if (I18N[c]) return c;
  return ["kk", "ky", "tg", "be", "uk", "tk"].indexOf(c) >= 0 ? "ru" : "en";
}

let curImg = null, curName = "image", curMode = "orig";
function processImage() {
  if (!curImg) return;
  setStatus(tr("tracing"), true);
  setTimeout(() => {
    try {
      const detail = detailFrom(+$("detail").value);
      let f = null;
      if (curMode === "color") f = traceColors(curImg, curName, true);
      else { f = traceEdges(curImg, curName, detail); f.showImg = curMode === "orig"; }
      $("traceCard").hidden = false;
      loadFlag(f);
      setStatus(tr(f.raw ? "done_edge" : "done_color"), true);
    } catch (err) { setStatus(errText(err)); }
  }, 40);
}
function handleFile(file) {
  if (!file || !/^image\//.test(file.type || "image/")) { setStatus(tr("not_image")); return; }
  setStatus(tr("reading"), true);
  const fr = new FileReader();
  fr.onerror = () => setStatus(tr("err") + ": " + tr("bad_file"));
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      curImg = img;
      curName = (file.name || "image").replace(/\.[^.]+$/, "").slice(0, 26) || "image";
      curMode = "orig";
      document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.m === "orig"));
      processImage();
    };
    img.onerror = () => setStatus(tr("err") + ": " + tr("bad_format"));
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
$("upload").onclick = () => { $("file").value = ""; $("file").click(); };

window.addEventListener("drop", ev => { ev.preventDefault(); const f = ev.dataTransfer && ev.dataTransfer.files[0]; if (f) handleFile(f); });
window.addEventListener("paste", ev => {

/* ---------- output: video / PNG -> sent to the bot chat (or saved) ---------- */
const safeName = () => (F.name || "drawing").replace(/[^\w\-]+/g, "_");
function downloadBlob(url, fname) {
  const a = document.createElement("a");
  a.href = url; a.download = fname; a.style.display = "none";
  document.body.appendChild(a); a.click();
  setTimeout(() => { try { a.remove(); } catch (e) { /* ignore */ } }, 1500);
}
function setNote(text, ok) { const n = $("resNote"); n.textContent = text || ""; n.className = "status" + (ok ? " ok" : ""); }
async function sendToBot(blob, kind) {
  const btn = $("resSend"); btn.disabled = true; setNote(tr("sending"), true);
  try {
    if (blob.size > 49 * 1024 * 1024) throw new Error("big");
    const fd = new FormData();
    fd.append("initData", tg.initData);
    fd.append("kind", kind);
    fd.append("duration", String(Math.round(TOTAL / 1000)));
    fd.append("caption", tr("caption") + (wmText ? "\n" + wmText : ""));
    fd.append("file", blob, kind === "image" ? "drawing.png" : "drawing.mp4");
    const r = await fetch(UPLOAD_URL, { method: "POST", body: fd });
    let j = null; try { j = await r.json(); } catch (e) { /* not json */ }
    if (!r.ok || !j || !j.ok) throw new Error((j && (j.error_text || j.error)) || ("HTTP " + r.status));
    setNote(tr("sent_ok"), true); $("resChat").hidden = false;
    try { if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success"); } catch (e) { /* ignore */ }
  } catch (e) {
    const msg = String(e && e.message || e);
    if (msg === "big") setNote(tr("send_big"));
    else if (/initiate|blocked|forbidden|chat not found|403/i.test(msg)) setNote(tr("send_start"));
    else setNote(tr("send_fail") + ": " + msg);
  } finally { btn.disabled = false; }
}
let resUrl = null;
function deliver(blob, fname, kind) {
  if (resUrl) { try { URL.revokeObjectURL(resUrl); } catch (e) { /* ignore */ } }
  resUrl = URL.createObjectURL(blob);
  $("resTitle").textContent = tr(kind === "video" ? "res_video" : "res_png");
  const holder = $("resMedia"); holder.innerHTML = "";
  const m = document.createElement(kind === "video" ? "video" : "img");
  if (kind === "video") { m.controls = true; m.setAttribute("playsinline", ""); }
  m.src = resUrl; holder.appendChild(m);
  let file = null;
  try { file = new File([blob], fname, { type: blob.type }); } catch (e) { /* old browser */ }
  const canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
  const canSend = !!(UPLOAD_URL && tg && tg.initData);
  $("resSend").hidden = !canSend;
  $("resChat").hidden = true;
  $("resSave").className = canSend ? "pill" : "main";
  $("resShare").hidden = !canShare;
  $("resBrowser").hidden = !inTg || canSend;
  $("resHint").textContent = tr(canSend ? "res_hint_bot" : "res_hint");
  setNote("");
  $("resSend").onclick = () => sendToBot(blob, kind);
  $("resChat").onclick = () => { try { tg.close(); } catch (e) { /* ignore */ } };
  $("resSave").onclick = () => { downloadBlob(resUrl, fname); setNote(tr("res_started"), true); };
  $("resShare").onclick = () => { navigator.share({ files: [file], title: fname }).catch(() => {}); };
  $("resBrowser").onclick = () => {
    const u = location.href.split("#")[0];
    try { if (tg && tg.openLink) tg.openLink(u, { try_instant_view: false }); else window.open(u, "_blank"); } catch (e) { window.open(u, "_blank"); }
  };
  $("resModal").hidden = false;
  if (!canSend) { try { downloadBlob(resUrl, fname); } catch (e) { /* needs a tap */ } }
}
$("resClose").onclick = () => { $("resModal").hidden = true; const v = $("resMedia").querySelector("video"); if (v) v.pause(); };
$("resModal").addEventListener("click", ev => { if (ev.target === $("resModal")) $("resClose").onclick(); });

$("png").onclick = async () => {
  if (recording || !F) return;
  recording = true;
  const oldT = T, oldPlay = playing;
  cv.width = 720; cv.height = 1280; kScale = 1;
  T = TOTAL; frame();
  const blob = await new Promise(res => cv.toBlob(res, "image/png"));
  recording = false; T = oldT; playing = oldPlay; resize();
  if (blob) deliver(blob, safeName() + ".png", "image");
};

const BUSY = ["rec", "png", "upload", "play", "restart", "skip", "speed", "musicBtn", "scrub", "apply", "size"];
$("rec").onclick = async () => {
  if (recording) return;
  if (!window.MediaRecorder || !cv.captureStream) { setStatus(tr("rec_unsup")); return; }
  let wantAudio = false;
  if (music.mode !== "off" && music.ensure() && (music.mode === "gen" || music.fileBuf)) {
    try { await music.ctx.resume(); wantAudio = music.ctx.state === "running"; } catch (e) { wantAudio = false; }
  }
  const types = wantAudio
    ? ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"]
    : ["video/mp4;codecs=avc1.42E01E", "video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t));
  if (!mime) { setStatus(tr("rec_nofmt")); return; }
  recording = true;
  try { if (tg && tg.enableClosingConfirmation) tg.enableClosingConfirmation(); } catch (e) { /* ignore */ }
  const oldSpeed = speedMul; speedMul = 1; updateSpeedUI();
  cv.width = 720; cv.height = 1280; kScale = 1;
  BUSY.forEach(id => $(id).disabled = true);
  T = 0; playing = true; scrubbing = false; setPlayUI(true);
  const stream = cv.captureStream(30);
  if (wantAudio) music.recDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const chunks = [];
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6000000 });
  rec.ondataavailable = ev => { if (ev.data && ev.data.size) chunks.push(ev.data); };
  const finished = new Promise(res => { rec.onstop = res; });
  rec.start(500);
  if (wantAudio) { recording = false; music.start(0, 1); recording = true; }
  let endAt = 0, faded = false;
  const timer = setInterval(() => {
    setStatus(tr("rec_prog", { p: Math.min(100, Math.round(T / TOTAL * 100)) }), true);
    if (T >= TOTAL) {
      if (!endAt) endAt = performance.now() + HOLD_END;
      if (!faded && performance.now() >= endAt - 400) { faded = true; music.fade(0.35); }
      if (performance.now() >= endAt) { clearInterval(timer); rec.stop(); }
    }
  }, 150);
  await finished;
  music.stop();
  recording = false; speedMul = oldSpeed; updateSpeedUI();
  BUSY.forEach(id => $(id).disabled = false);
  try { if (tg && tg.disableClosingConfirmation) tg.disableClosingConfirmation(); } catch (e) { /* ignore */ }
  resize();
  setStatus("");
  const ext = mime.indexOf("mp4") >= 0 ? "mp4" : "webm";
  deliver(new Blob(chunks, { type: ext === "mp4" ? "video/mp4" : "video/webm" }), safeName() + "." + ext, "video");
  T = TOTAL; playing = false; setPlayUI(false);
};

{
